<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One-bit Desktop — sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { background-color: #000; background-image: radial-gradient(#3a3a3a 0.7px, transparent 0.8px); background-size: 4px 4px; color: #fff; font-family: "Atkinson Hyperlegible Next", sans-serif; position: relative; }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: #000; border-bottom: 2px solid #fff; display: flex; align-items: center; gap: 22px; padding: 0 14px; font-family: "Pixelify Sans"; font-weight: 600; font-size: 17px; }
  .menubar .r { margin-left: auto; }
  .dlg { position: absolute; left: 50%; top: 170px; width: 620px; transform: translateX(-50%); background: #000; border: 2px solid #fff; box-shadow: 6px 6px 0 #fff; padding: 6px; }
  .dlg .in { border: 2px solid #fff; padding: 26px 30px 28px; }
  .row { display: flex; gap: 22px; align-items: flex-start; }
  .row svg { flex: none; }
  h1 { font-family: "Pixelify Sans"; font-weight: 700; font-size: 34px; }
  .sub { margin-top: 4px; color: #bbb; font-size: 16px; }
  .f { margin-top: 20px; display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 12px; }
  .f label { font-family: "Pixelify Sans"; font-weight: 600; font-size: 17px; text-align: right; }
  .box { height: 44px; border: 2px solid #fff; display: flex; align-items: center; padding: 0 12px; font-size: 17px; }
  .box.focus { outline: 2px dashed #fff; outline-offset: 3px; }
  .box span { margin-left: auto; font-family: "Pixelify Sans"; font-size: 14px; color: #bbb; }
  .forgot { grid-column: 2; font-size: 14px; text-decoration: underline; text-underline-offset: 4px; color: #ddd; margin-top: -4px; }
  .btns { margin-top: 26px; display: flex; justify-content: flex-end; gap: 16px; align-items: center; }
  .b { font-family: "Pixelify Sans"; font-weight: 700; font-size: 18px; padding: 8px 24px; border: 2px solid #fff; border-radius: 10px; }
  .b.default { background: #fff; color: #000; outline: 3px solid #fff; outline-offset: 3px; }
  .icons { position: absolute; right: 26px; top: 60px; display: flex; flex-direction: column; gap: 22px; align-items: center; font-family: "Pixelify Sans"; font-size: 15px; }
  .icon { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon span { background: #000; padding: 0 4px; }
  .note { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); font-family: "Pixelify Sans"; font-size: 16px; color: #bbb; background: #000; padding: 2px 8px; }
</style></head><body>
  <div class="menubar"><svg width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="1" width="10" height="2" fill="#fff"/><rect x="1" y="3" width="2" height="10" fill="#fff"/><rect x="3" y="13" width="10" height="2" fill="#fff"/><rect x="13" y="3" width="2" height="4" fill="#fff"/><rect x="8" y="5" width="4" height="4" fill="#fff"/></svg><span>Realm</span><span>File</span><span>Edit</span><span>Help</span><span class="r">9:41 PM</span></div>
  <div class="dlg"><div class="in">
    <div class="row"><svg width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="1" width="10" height="2" fill="#fff"/><rect x="1" y="3" width="2" height="10" fill="#fff"/><rect x="3" y="13" width="10" height="2" fill="#fff"/><rect x="13" y="3" width="2" height="4" fill="#fff"/><rect x="8" y="5" width="4" height="4" fill="#fff"/></svg><div><h1>Sign in to Realm</h1><p class="sub">Your Spaces are where you left them.</p></div></div>
    <div class="f"><label>Email or username:</label><div class="box focus">noor.h</div></div>
    <div class="f"><label>Password:</label><div class="box">••••••••••••<span>Show</span></div><span class="forgot">Forgot your password?</span></div>
    <div class="btns"><span class="b">Create account…</span><span class="b default">Sign in</span></div>
  </div></div>
  <span class="note">Press Return to sign in</span>
  <div class="icons">
    <div class="icon"><svg width="40" height="40" viewBox="0 0 20 20" shape-rendering="crispEdges"><rect x="2" y="4" width="16" height="12" fill="none" stroke="#fff" stroke-width="2"/><rect x="5" y="7" width="6" height="2" fill="#fff"/></svg><span>Read me</span></div>
    <div class="icon"><svg width="40" height="40" viewBox="0 0 20 20" shape-rendering="crispEdges"><rect x="4" y="5" width="12" height="13" fill="none" stroke="#fff" stroke-width="2"/><rect x="2" y="3" width="16" height="2" fill="#fff"/></svg><span>Trash</span></div>
  </div>
</body></html>
