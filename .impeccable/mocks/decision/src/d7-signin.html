<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard — sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&family=Atkinson+Hyperlegible+Next:wght@400;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { background: #4b4fe6; font-family: "Atkinson Hyperlegible Next", sans-serif; display: grid; place-items: center; position: relative; }
  .logo { position: absolute; left: 40px; top: 30px; font-family: "Figtree"; font-weight: 900; font-size: 24px; color: #fff; display: flex; gap: 10px; align-items: center; }
  .card { width: 784px; background: #313338; border-radius: 8px; padding: 32px; display: grid; grid-template-columns: 1fr 240px; gap: 64px; color: #dbdee1; box-shadow: 0 2px 10px rgb(0 0 0 / .2); }
  h1 { font-family: "Figtree"; font-weight: 800; font-size: 26px; color: #fff; text-align: center; }
  .sub { text-align: center; color: #b5bac1; margin-top: 6px; font-size: 16px; }
  .f { margin-top: 20px; }
  .f label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: #b5bac1; margin-bottom: 8px; text-transform: uppercase; }
  .f label i { color: #f23f42; font-style: normal; }
  .box { height: 42px; border-radius: 4px; background: #1e1f22; display: flex; align-items: center; padding: 0 10px; color: #dbdee1; font-size: 16px; }
  .link { display: block; margin-top: 6px; color: #00a8fc; font-size: 14px; }
  .btn { margin-top: 20px; height: 44px; border-radius: 4px; background: #4b4fe6; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .reg { margin-top: 8px; font-size: 14px; color: #949ba4; } .reg span { color: #00a8fc; }
  .qr { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .qr i { width: 176px; height: 176px; border-radius: 4px; background: #fff; padding: 8px; display: block; background-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 16px), repeating-linear-gradient(0deg, #000 0 8px, transparent 8px 16px); background-blend-mode: multiply; }
  .qr h2 { font-family: "Figtree"; font-weight: 800; font-size: 22px; color: #fff; margin-top: 28px; }
  .qr p { color: #b5bac1; margin-top: 8px; font-size: 15px; }
</style></head><body>
  <span class="logo"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#fff"/><circle cx="18" cy="12.5" r="9" fill="#4b4fe6"/></svg>Realm</span>
  <div class="card">
    <div>
      <h1>Welcome back!</h1><p class="sub">We're so excited to see you again!</p>
      <div class="f"><label>Email or username <i>*</i></label><div class="box">noor.h</div></div>
      <div class="f"><label>Password <i>*</i></label><div class="box">••••••••••••</div><span class="link">Forgot your password?</span></div>
      <div class="btn">Log In</div>
      <p class="reg">Need an account? <span>Register</span></p>
    </div>
    <div class="qr"><i></i><h2>Log in with QR Code</h2><p>Scan this with the Realm mobile app to log in instantly.</p></div>
  </div>
</body></html>
