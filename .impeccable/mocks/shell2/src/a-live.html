<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="_base.css" />
    <script src="_data.js"></script>
    <style>
      /* A · Live frame: edge-to-edge panes split by hairlines, no floating boxes. The sidebar is
         live (who's in voice shows under the Space), Home lists your Spaces as big rows. */
      .top {
        position: fixed;
        inset: 0 0 auto 0;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 14px 0 20px;
        border-bottom: 1px solid var(--rule);
        background: rgb(11 11 14 / 0.5);
      }
      .dest {
        display: flex;
        gap: 2px;
        margin-left: 18px;
      }
      .dest a {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .dest a.on {
        color: var(--ink);
        background: rgb(255 255 255 / 0.08);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06);
      }
      .search {
        margin-left: auto;
        width: 300px;
        height: 40px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px 0 14px;
        color: var(--ink-3);
        background: rgb(255 255 255 / 0.035);
        box-shadow: inset 0 0 0 1px var(--rule-2);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .body {
        position: fixed;
        inset: 60px 0 0 0;
        display: grid;
        grid-template-columns: 268px 1fr 296px;
      }
      .side,
      .right {
        background: rgb(14 14 18 / 0.72);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side {
        border-right: 1px solid var(--rule);
        padding: 14px 10px 0;
      }
      .right {
        border-left: 1px solid var(--rule);
        padding: 20px 16px;
      }
      .main {
        background: rgb(19 19 24 / 0.94);
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .sidehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px 8px 10px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-3);
      }
      .srow {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 10px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        color: var(--ink-2);
      }
      .srow.unread {
        color: var(--ink);
      }
      .srow.on {
        background: rgb(255 255 255 / 0.07);
        color: var(--ink);
      }
      .udot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink);
      }
      .vlive {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -2px 0 6px 52px;
        height: 30px;
        padding: 0 8px;
        border-radius: 9px;
        color: var(--ink-2);
        font-size: 13.5px;
        font-weight: 600;
        --stack-cut: #111116;
      }
      .vlive .ic {
        color: var(--presence);
        width: 16px;
        height: 16px;
      }
      .me {
        margin: auto -10px 0;
        border-top: 1px solid var(--rule);
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 14px 14px 18px;
        --dot-cut: #101014;
      }
      .sidedest {
        display: none;
      }
      /* Home */
      .home {
        overflow: hidden;
        padding: 34px 44px;
      }
      .home .wrap {
        max-width: 880px;
      }
      .greet {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.1;
      }
      .sub {
        margin-top: 8px;
        font-size: 15.5px;
      }
      .setup {
        margin-top: 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 10px 12px 16px;
        border-radius: 16px;
        background: rgb(255 255 255 / 0.035);
        box-shadow: inset 0 0 0 1px var(--rule-2);
      }
      h2.sec {
        margin: 32px 0 10px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-2);
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .liverow {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 16px 16px 16px;
        border-radius: 18px;
        background: linear-gradient(100deg, rgb(78 224 138 / 0.08), rgb(78 224 138 / 0) 60%), rgb(255 255 255 / 0.03);
        box-shadow: inset 0 0 0 1px rgb(78 224 138 / 0.22);
        --stack-cut: #16201c;
      }
      .spaces {
        list-style: none;
        border-top: 1px solid var(--rule);
      }
      .spaces li {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 15px 8px;
        border-bottom: 1px solid var(--rule);
      }
      .spaces .nm {
        font-size: 17px;
        font-weight: 700;
      }
      .spaces .ln {
        margin-top: 3px;
        font-size: 14.5px;
        color: var(--ink-2);
      }
      .spaces .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        width: 44px;
      }
      /* Right: Here now */
      .rh {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 0 6px 6px;
      }
      .grp {
        margin: 16px 6px 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        padding: 0 6px;
        border-radius: 12px;
        --dot-cut: #111116;
      }
      .person .pn {
        font-weight: 600;
        font-size: 15px;
      }
      .person .ps {
        font-size: 13px;
        color: var(--ink-3);
      }
      /* Space view */
      .shead {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px 0;
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 8px 18px 0;
        border-bottom: 1px solid var(--rule);
      }
      .tabs a {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 42px;
        padding: 0 10px;
        font-weight: 600;
        color: var(--ink-3);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs a.on {
        color: var(--ink);
        border-color: var(--ink);
      }
      .tabs a.unread {
        color: var(--ink);
      }
      .chat {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 28px 8px;
        gap: 2px;
      }
      .foot {
        padding: 6px 24px 18px;
      }
      @media (max-width: 1023px) {
        .dest,
        .right {
          display: none;
        }
        .body {
          grid-template-columns: 236px 1fr;
        }
        .search {
          flex: 1;
          max-width: 420px;
          width: auto;
        }
        .msgrow {
          display: none;
        }
        .sidedest {
          display: block;
          padding-bottom: 8px;
          margin-bottom: 8px;
          border-bottom: 1px solid var(--rule);
        }
        .home {
          padding: 26px 26px;
        }
        .greet {
          font-size: 27px;
        }
        .chat {
          padding: 0 18px 8px;
        }
        .foot {
          padding: 6px 16px 14px;
        }
        .shead {
          padding: 12px 18px 0;
        }
        .tabs {
          padding: 6px 12px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <header class="top" id="tb"></header>
    <div class="body">
      <aside class="side" id="side"></aside>
      <main class="main" id="main"></main>
      <aside class="right" id="right"></aside>
    </div>
    <script>
      const view = new URLSearchParams(location.search).get("view") || "home";
      const DEST = [
        ["home", "Home"],
        ["spaces", "Spaces"],
        ["messages", "Messages"],
        ["feed", "Feed"],
        ["explore", "Explore"],
      ];
      const cur = view === "home" ? "home" : "spaces";
      tb.innerHTML = `
        ${WORD(26)}
        <nav class="dest">${DEST.map(([k, l]) => `<a class="${k === cur ? "on" : ""}">${ic(k, "", 19)}${l}</a>`).join("")}</nav>
        <div class="search">${ic("search", "", 18)}<span class="grow">Search or jump to…</span><span class="kbd">Ctrl K</span></div>
        <div class="actions"><span class="iconbtn">${ic("people")}</span><span class="iconbtn">${ic("plus")}</span><span class="iconbtn">${ic("bell")}</span><span style="margin-left:6px">${av("noor", 34, { dot: true, cut: "#0d0d10" })}</span></div>`;

      side.innerHTML = `
        <div class="sidedest">${DEST.map(([k, l]) => `<a class="srow ${k === cur ? "on" : ""}" style="height:42px">${ic(k, "", 19)}${l}</a>`).join("")}</div>
        <div class="sidehead"><span>Spaces</span><span class="iconbtn" style="width:30px;height:30px">${ic("plus", "", 17)}</span></div>
        ${S.map(
          (s) => `
          <a class="srow ${s.unread ? "unread" : ""} ${view === "space" && s.id === "lnl" ? "on" : ""}">${badge(s, 32, 10)}<span class="grow trunc">${s.n}</span>${s.unread ? `<span class="count">${s.unread}</span>` : s.dot ? '<i class="udot"></i>' : ""}</a>
          ${s.voice ? `<div class="vlive">${ic("speaker")}<span>${s.voice.room}</span><span style="margin-left:auto">${stack(s.voice.who, 20)}</span></div>` : ""}`,
        ).join("")}
        <div style="height:10px"></div>
        <a class="srow msgrow" style="color:var(--ink-3)">${ic("messages", "", 19)}<span class="grow">Messages</span><span class="tag">Soon</span></a>
        <div class="me">${av("noor", 36, { dot: true })}<div class="grow"><div style="font-weight:700">Noor</div><div class="faint" style="font-size:13px">Around</div></div><span class="iconbtn" style="width:34px;height:34px">${ic("settings", "", 19)}</span></div>`;

      const here = [
        ["In voice", [["kenji", "hangout · Late Night Lobby"], ["ama", "hangout · Late Night Lobby"], ["sol", "hangout · Late Night Lobby"]], true],
        ["Around", [["jun", "in #clips · Clip Club"], ["mira", "in #routes · Brooklyn Speedrunners"]]],
        ["Away", [["theo", "Away for 20 min"]]],
      ];
      right.innerHTML = `
        <div class="rh"><span style="font-weight:700;font-size:16px">Here now</span><span class="faint" style="font-size:13px">6 of 14 friends</span></div>
        ${here
          .map(
            ([g, ps, v]) => `<div class="grp">${v ? `<span style="color:var(--presence);display:flex">${ic("speaker", "", 15)}</span>` : ""}${g}</div>
            ${ps.map(([p, s]) => `<div class="person">${av(p, 36, { dot: true })}<div class="grow"><div class="pn">${P[p].n}</div><div class="ps trunc">${s}</div></div></div>`).join("")}`,
          )
          .join("")}
        <div style="margin-top:auto"><span class="btn ghost" style="width:100%">${ic("invite", "", 18)}Invite friends</span></div>`;

      if (view === "home") {
        main.innerHTML = `
        <div class="home"><div class="wrap">
          <h1 class="display greet">Good evening, Noor</h1>
          <p class="sub soft"><span class="live" style="font-size:15px">6 friends around</span><span class="faint"> · </span>hangout is live in Late Night Lobby</p>
          <div class="setup"><span style="color:var(--acc);display:flex">${ic("mail", "", 22)}</span><div class="grow"><div style="font-weight:700">Confirm your email to finish setting up</div><div class="soft" style="font-size:14px">We sent a code to noor55353@example.com.</div></div><span class="btn ghost">Enter code</span><span class="iconbtn" style="width:34px;height:34px">${ic("x", "", 18)}</span></div>

          <h2 class="sec">Live now</h2>
          <div class="liverow">${badge(S[0], 48, 14)}<div class="grow"><div class="row" style="gap:8px;font-weight:700;font-size:17px"><span style="color:var(--presence);display:flex">${ic("speaker", "", 19)}</span>hangout</div><div class="soft trunc" style="font-size:14.5px;margin-top:2px">Late Night Lobby · Kenji, Ama and Sol are talking</div></div>${stack(["kenji", "ama", "sol"], 34)}<span class="btn act" style="margin-left:8px">${ic("headset", "", 18)}Join</span></div>

          <h2 class="sec">Your Spaces <span class="faint" style="font-weight:600">4</span></h2>
          <ul class="spaces">${S.map(
            (s) => `<li>${badge(s, 50, 15)}
              <div class="grow"><div class="nm trunc">${s.n}</div><div class="ln trunc"><span class="faint">#${s.last[1]}</span>&nbsp; ${P[s.last[0]].n}: ${s.last[2]}</div></div>
              ${s.here.length ? `<span style="margin-right:6px">${stack(s.here, 26)}</span>` : ""}
              <div class="meta"><span class="faint" style="font-size:12.5px">${s.when}</span>${s.unread ? `<span class="count">${s.unread}</span>` : '<span style="height:22px"></span>'}</div></li>`,
          ).join("")}</ul>
        </div></div>`;
      } else {
        const rooms = [
          ["hash", "general", "on"],
          ["hash", "clips-and-lfg", "unread"],
          ["hash", "routes", ""],
        ];
        main.innerHTML = `
        <div class="shead">${badge(S[0], 38, 11)}<span class="display grow trunc" style="font-size:23px;font-weight:700">Late Night Lobby</span>
          <span class="btn ghost" style="height:36px;font-size:14px"><span class="live" style="font-size:14px">4 here now</span></span><span class="btn ghost" style="height:36px;font-size:14px">${ic("invite", "", 17)}Invite</span><span class="iconbtn">${ic("more")}</span></div>
        <nav class="tabs">${rooms.map(([i, n, st]) => `<a class="${st}">${ic(i, "", 17)}${n}</a>`).join("")}<a>${ic("speaker", "", 17)}hangout <span style="margin-left:2px">${stack(["kenji", "ama", "sol"], 18, "#131318")}</span></a></nav>
        <div class="chat" id="chat"></div>
        <div class="foot"><div class="composer"><span class="iconbtn">${ic("clip")}</span><span class="ph">Message #general</span><span class="send">${ic("send", "", 19)}</span></div></div>`;
        chat.innerHTML = renderChat();
        right.querySelector(".rh span").textContent = "Here now";
        right.querySelector(".rh .faint").textContent = "4 of 9 members";
      }

      function renderChat() {
        let h = "";
        for (const m of CHAT) {
          if (m.day) {
            h += `<div style="text-align:center;margin:10px 0 12px"><span class="stamp" style="font-weight:700">${m.day}</span></div>`;
            continue;
          }
          const mine = m.who === "noor";
          h += `<div class="row" style="align-items:flex-end;gap:10px;margin-top:12px;${mine ? "justify-content:flex-end" : ""}">
            ${mine ? "" : av(m.who, 32)}
            <div class="col" style="gap:3px;${mine ? "align-items:flex-end" : "align-items:flex-start"}">
              ${mine ? "" : `<span style="font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 1px 4px">${P[m.who].n}</span>`}
              ${m.pic ? `<span style="width:340px;aspect-ratio:16/9;border-radius:16px;background:${img(m.pic)} center/cover"></span>` : ""}
              ${m.t.map((t, i) => `<span class="bub ${mine ? "mine" : ""}">${t}${i === m.t.length - 1 && m.who === "kenji" && m.t[0].startsWith("in,") ? ' <span class="stamp" style="margin-left:6px">9:06 PM</span>' : ""}</span>`).join("")}
            </div></div>`;
        }
        return h;
      }
    </script>
  </body>
</html>
