<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_world.css"><link rel="stylesheet" href="_app.css"><script src="_parts.js"></script>
<style>
.dock{position:absolute;left:10px;top:10px;bottom:10px;width:82px;display:flex;flex-direction:column;align-items:center;padding:16px 0 12px}
.di{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;padding:9px 0 7px;border-radius:16px;color:var(--ink-2);font-size:0.74rem;font-weight:700;position:relative}
.di.on{color:var(--ink);background:rgb(255 255 255/.08);box-shadow:inset 0 0 0 1px rgb(255 255 255/.1)}
.di .count{position:absolute;top:3px;right:6px;height:19px;min-width:19px;font-size:0.72rem;padding:0 5px}
.head{position:absolute;left:102px;right:10px;top:10px;height:56px;display:flex;align-items:center;gap:12px;padding:0 8px 0 14px}
.grid{position:absolute;left:102px;right:10px;top:72px;bottom:10px;display:grid;grid-template-columns:340px 1fr 288px;gap:10px}
</style></head>
<body><div class="field-bg dim"></div><div class="grain"></div>
<div class="frame dock">
  <span id="mk" style="color:var(--ink)"></span>
  <nav class="col" style="gap:6px;margin-top:22px" id="nav"></nav>
  <span class="iconbtn" id="cr" style="margin-top:14px;box-shadow:inset 0 0 0 1px rgb(255 255 255/.16);width:44px;height:44px"></span>
  <div style="margin-top:auto" class="col" id="foot"></div>
</div>
<div class="head">
  <h1 class="display" style="font-size:1.7rem;letter-spacing:-0.035em">Messages</h1>
  <div class="travel" style="width:360px;margin-left:auto" id="tr"></div>
  <span class="chip" style="height:40px;padding:0 14px" id="hn"></span>
</div>
<div class="grid">
  <div class="frame" style="padding:16px 12px" id="ibx"></div>
  <div class="frame col" id="conv"><div id="hd"></div><div class="scrollend" style="padding:6px 26px 0" id="ms"></div><div style="padding:10px 26px 16px" id="cp"></div></div>
  <div class="frame" style="padding:16px 8px;overflow:hidden" id="here"></div>
</div>
<script>
mk.innerHTML = '<span style="display:block;width:32px;height:32px">'+MARK.replace('viewBox','width="32" height="32" viewBox')+'</span>';
nav.innerHTML = [["home","Home"],["spaces","Spaces"],["messages","Messages",'<span class="count">2</span>'],["feed","Feed"],["explore","Explore"]]
  .map(([i,l,b],k)=>`<span class="di ${k===2?"on":""}">${ic(i)}${l}${b||""}</span>`).join("");
cr.innerHTML = ic("plus");
foot.innerHTML = `<span class="di" style="position:relative">${ic("bell")}Alerts<span class="count" style="background:var(--acc)">1</span></span><span class="di">${av("you",34,true)}You</span>`;
tr.innerHTML = ic("search","sm") + "Search or jump to…" + '<span class="kbd">Ctrl K</span>';
hn.innerHTML = '<i class="dot"></i>4 here now';
ibx.innerHTML = inbox({title:false});
hd.innerHTML = convoHeader();
ms.innerHTML = messages();
cp.innerHTML = composer();
here.innerHTML = peek();
</script></body></html>
