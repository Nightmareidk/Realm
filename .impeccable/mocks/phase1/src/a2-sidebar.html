<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_world.css"><link rel="stylesheet" href="_app.css"><script src="_parts.js"></script>
<style>
.grid{position:absolute;inset:10px;display:grid;grid-template-columns:330px 1fr;gap:10px}
.side{display:flex;flex-direction:column;padding:18px 12px 12px}
.navi{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-weight:700;font-size:0.97rem}
.navi.on{color:var(--ink);background:rgb(255 255 255/.08);box-shadow:inset 0 0 0 1px rgb(255 255 255/.1)}
.navi .count{margin-left:auto}
.mini{display:flex;align-items:center;gap:11px;height:50px;padding:0 10px;border-radius:12px}
.mini.on{background:var(--raised)}
.mini b{font-size:0.94rem}
.mini p{font-size:0.82rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body><div class="field-bg dim"></div><div class="grain"></div>
<div class="grid">
  <div class="frame side">
    <div class="row" style="justify-content:space-between;padding:0 6px 14px"><span class="mark" id="mk"></span><span class="row"><span class="iconbtn" id="cr" style="box-shadow:inset 0 0 0 1px rgb(255 255 255/.14)"></span><span class="iconbtn" id="bl" style="position:relative"></span></span></div>
    <div class="travel" id="tr"></div>
    <nav class="col" style="gap:2px;margin-top:12px" id="nav"></nav>
    <div class="rule" style="margin:14px 6px"></div>
    <div class="row" style="justify-content:space-between;padding:0 8px 8px"><span class="small" style="font-weight:700;color:var(--ink-2)">Here now</span><span class="small ink2">4</span></div>
    <div class="row" style="gap:9px;padding:0 8px 12px" id="here"></div>
    <div class="row" style="justify-content:space-between;padding:0 8px 6px"><span class="small" style="font-weight:700;color:var(--ink-2)">Chats</span><span id="pen"></span></div>
    <div class="col" style="gap:1px;flex:1;overflow:hidden" id="chats"></div>
    <div class="row" style="gap:11px;padding:10px 8px 0;border-top:1px solid var(--hair)"><span id="me"></span><div style="flex:1"><b style="font-size:0.95rem">Sam</b><div class="small ink2">Around · @sam</div></div><span class="iconbtn" id="st"></span></div>
  </div>
  <div class="frame col" id="conv"><div id="hd"></div><div class="scrollend" style="padding:6px 40px 0" id="ms"></div><div style="padding:10px 40px 16px" id="cp"></div></div>
</div>
<script>
mk.innerHTML = MARK + "realm";
cr.innerHTML = ic("plus","sm");
bl.innerHTML = ic("bell","sm") + '<i style="position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--acc)"></i>';
tr.innerHTML = ic("search","sm") + "Search or jump to…" + '<span class="kbd">Ctrl K</span>';
nav.innerHTML = [["home","Home"],["spaces","Spaces",'<span class="ndot" style="margin-left:auto"></span>'],["messages","Messages",'<span class="count">2</span>'],["feed","Feed"],["explore","Explore"]]
  .map(([i,l,b],k)=>`<span class="navi ${k===2?"on":""}">${ic(i)}${l}${b||""}</span>`).join("");
here.innerHTML = ["noor","kenji","ama","sol"].map(p=>av(p,40,true)).join("");
pen.innerHTML = '<span style="color:var(--ink-2)">'+ic("pen","sm")+'</span>';
chats.innerHTML = [
  [av("noor",34,true),"Noor",'<p style="color:var(--acc)">typing…</p>',""],
  [group("kenji","sol",34),"Ranked night","<p>Kenji: in, bringing snacks</p>",'<span class="count">@</span>'],
  [av("ama",34,true),"Ama","<p>You: lol no, that was Sol</p>",""],
  [group("sol","jun",34),"Clip club","<p>Sol sent a photo</p>",'<span class="count n">4</span>'],
  [av("jun",34),"Jun","<p>see you sunday</p>",""],
  [av("theo",34),"Theo","<p>the jump that shouldn't have worked</p>",""],
].map(([a,n,p,b],i)=>`<div class="mini ${i===0?"on":""}">${a}<div style="flex:1;min-width:0"><b>${n}</b>${p}</div>${b}</div>`).join("");
me.innerHTML = av("you",36,true);
st.innerHTML = ic("settings","sm");
hd.innerHTML = convoHeader({hereNowPill:false});
ms.innerHTML = messages();
cp.innerHTML = composer();
</script></body></html>
