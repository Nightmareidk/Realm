<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_world.css"><link rel="stylesheet" href="_app.css"><script src="_parts.js"></script>
<style>
.top{height:64px;display:flex;align-items:center;gap:18px;padding:0 18px 0 22px}
.grid{position:absolute;left:10px;right:10px;top:64px;bottom:10px;display:grid;grid-template-columns:340px 1fr 300px;gap:10px}
</style></head>
<body><div class="field-bg dim"></div><div class="grain"></div>
<div class="top">
  <span class="mark" id="mk"></span>
  <nav class="row" style="gap:4px;margin-left:22px" id="nav"></nav>
  <div class="travel" style="width:320px;margin-left:auto" id="tr"></div>
  <span class="iconbtn" id="cr" style="box-shadow:inset 0 0 0 1px rgb(255 255 255/.14)"></span>
  <span class="iconbtn" id="bl" style="position:relative"></span>
  <span id="me"></span>
</div>
<div class="grid">
  <div class="frame" style="padding:16px 12px" id="ibx"></div>
  <div class="frame col" id="conv"><div id="hd"></div><div class="scrollend" style="padding:6px 26px 0" id="ms"></div><div style="padding:10px 26px 16px" id="cp"></div></div>
  <div class="frame" style="padding:16px 8px;overflow:hidden" id="here"></div>
</div>
<script>
mk.innerHTML = MARK + "realm";
nav.innerHTML = [["home","Home"],["spaces","Spaces"],["messages","Messages",'<span class="count">2</span>'],["feed","Feed"],["explore","Explore"]]
  .map(([i,l,b],k)=>`<span class="pillnav ${k===2?"on":""}">${ic(i,"sm")}${l}${b||""}</span>`).join("");
tr.innerHTML = ic("search","sm") + "Search or jump to…" + '<span class="kbd">Ctrl K</span>';
cr.innerHTML = ic("plus");
bl.innerHTML = ic("bell") + '<i style="position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--acc)"></i>';
me.innerHTML = av("you",36,true);
ibx.innerHTML = inbox();
hd.innerHTML = convoHeader();
ms.innerHTML = messages();
cp.innerHTML = composer();
here.innerHTML = peek();
</script></body></html>
