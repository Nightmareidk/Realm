# Realm's own voice and video server (LiveKit), for a Linux server you rent.
# Guide: docs/SELF-HOSTING.md. Start with `docker compose up -d` in this folder.
#
# Both services use the host's network: WebRTC sends media over a wide range of UDP ports, which
# Docker's port mapping handles badly.
name: realm-voice

services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    environment:
      # "APIKEY: secret", from .env next to this file (never committed).
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?set LIVEKIT_KEYS in .env}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # HTTPS for wss://VOICE_DOMAIN, with certificates from Let's Encrypt, renewed automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      VOICE_DOMAIN: ${VOICE_DOMAIN:?set VOICE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
