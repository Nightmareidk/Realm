# Local development infrastructure. `pnpm infra:up` from the repo root.
# Mirrors production services; credentials here are for local use only.
name: realm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realm
      POSTGRES_PASSWORD: realm
      POSTGRES_DB: realm
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realm"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: realm
      MINIO_ROOT_PASSWORD: realm-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # Creates the media bucket on first start.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 realm realm-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/realm-media;
      "

  # Catches every email the app sends. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres:
  minio:
